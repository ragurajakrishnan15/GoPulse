# Dependency updates: monthly, grouped, minor/patch only.
#
# Why: ungrouped weekly updates opened 14 pull requests at once, including risky major jumps (TypeScript 5->7, ESLint 9->10).
# Now each ecosystem gets at most one grouped PR a month. Every PR still runs the full CI, so merge when it is green.
# Major versions of libraries are skipped on purpose: upgrade them deliberately, one at a time.
# Exception: GitHub Actions majors ARE allowed (grouped), because they only change the CI runner, CI validates them, and
# older action majors get deprecated (e.g. the Node 20 warning), which would eventually break the pipeline.
# Security fixes are separate: GitHub raises security-update PRs regardless of this schedule.
version: 2
updates:
  - package-ecosystem: pip
    directories:
      - /
      - /services/api
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      python-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      web-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /infrastructure/docker/api
      - /infrastructure/docker/web
      - /infrastructure/docker/pipeline
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      base-images:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
