name: Deploy

# Deploys ONLY from `main`, ONLY after the CI workflow succeeded on that exact commit, and ONLY when the repository variable
# DEPLOY_ENABLED is "true" (off by default, so forks and fresh clones never try to deploy).
# Both halves go to Vercel (see docs/deployment.md): the API as a Python function (a staged, self-contained bundle) and the site
# as a Next.js project. Credentials live in the `production` environment (add required reviewers there for a manual gate).
#
# Required secrets (environment `production`): VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_WEB_PROJECT_ID, VERCEL_API_PROJECT_ID
# Required variables: DEPLOY_ENABLED=true, PUBLIC_API_URL, PUBLIC_WEB_URL (the stable production URLs, no trailing slash)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false      # never interrupt a deployment half-way

jobs:
  gate:
    name: Check deploy preconditions
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.decide.outputs.go }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - id: decide
        env:
          ENABLED: ${{ vars.DEPLOY_ENABLED }}
          EVENT: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          REF: ${{ github.ref }}
        run: |
          go=false
          if [ "$ENABLED" = "true" ]; then
            if [ "$EVENT" = "workflow_run" ] && [ "$CONCLUSION" = "success" ]; then go=true; fi
            if [ "$EVENT" = "workflow_dispatch" ] && [ "$REF" = "refs/heads/main" ]; then go=true; fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "sha=${RUN_SHA:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "deploy: $go (enabled=$ENABLED event=$EVENT conclusion=$CONCLUSION)"

  api:
    name: Deploy API (Vercel Python function)
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Stage the self-contained API bundle
        run: python scripts/stage_api.py
      - name: Deploy to production
        working-directory: deploy/api
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
      - name: Smoke-test the live API (read-only checks; CORS for the site)
        run: |
          for _ in $(seq 1 12); do
            python scripts/smoke_api.py "${{ vars.PUBLIC_API_URL }}" --origin "${{ vars.PUBLIC_WEB_URL }}" && exit 0
            sleep 10
          done
          echo "the deployed API did not pass its smoke test"; exit 1

  web:
    name: Deploy web (Vercel Next.js)
    needs: [gate, api]            # never point the site at an API that failed to deploy
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Build and deploy
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEXT_PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}      # inlined into the browser bundle at build time
        run: |
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" --build-env NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL"
      - name: Check the live site
        run: |
          for _ in $(seq 1 12); do
            curl -fsS -o /dev/null -w 'site %{http_code}\n' "${{ vars.PUBLIC_WEB_URL }}" && exit 0
            sleep 10
          done
          exit 1
