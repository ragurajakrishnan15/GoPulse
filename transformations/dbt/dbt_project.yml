name: gopulse
version: "1.0.0"
config-version: 2
profile: gopulse

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

models:
  gopulse:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts

vars:
  # Rates are only reported for cohorts whose observation window has fully elapsed (docs/metrics.md).
  min_cohort_size_for_rate: 1
